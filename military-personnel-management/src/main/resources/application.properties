spring.application.name=military-personnel-management
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/military_personnel_db
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=3600000

logging.level.org.springframework.security=INFO
logging.level.org.springframework.security.web=INFO
tpm.helper-url=${TPM_HELPER_URL:http://127.0.0.1:8765}
totp.encryption-key=${TOTP_ENCRYPTION_KEY:}
